<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WAREXX · Leads admin</title>
<!-- The admin page for the website's leads and free-trial users (lead-api/admin.py,
     lead-api/store.py). Not linked from the site; locked by ADMIN_PASSWORD on the
     server. Self-contained: nothing loads from anywhere else. -->
<style>
  :root { --ink: #141414; --mute: #6E675E; --line: #E7E2DA; --fill: #FAF8F5; --brand: #D9601B; --ok: #2E7D4F; --bad: #B3261E; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F2EE; color: var(--ink); font: 14px/1.5 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, select { font: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; }
  .brand b { color: var(--brand); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  /* sign in */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login .card { width: min(380px, 100%); padding: 28px; }
  .login h1 { font-size: 20px; margin: 14px 0 4px; }
  .login p { margin: 0 0 16px; color: var(--mute); }
  label span { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  input[type=password], input[type=search], select { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  input:focus, select:focus, button:focus-visible { outline: 2px solid rgba(217, 96, 27, .35); outline-offset: 1px; }
  .btn { height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--fill); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover { background: #000; }
  .btn:disabled { opacity: .5; cursor: default; }
  .err { color: var(--bad); font-size: 13px; margin: 10px 0 0; min-height: 1em; }
  /* the page */
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { padding: 14px 16px; }
  .stat small { color: var(--mute); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .stat b { display: block; font-size: 26px; letter-spacing: -.02em; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 600; cursor: pointer; }
  .tab[aria-selected=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); }
  .tools .grow { flex: 1 1 260px; }
  .tools select { width: auto; min-width: 170px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--fill); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); white-space: nowrap; }
  td.when { white-space: nowrap; color: var(--mute); }
  td .sub { color: var(--mute); font-size: 12px; }
  td.msg { max-width: 280px; white-space: pre-wrap; word-break: break-word; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--fill); border: 1px solid var(--line); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: rgba(46, 125, 79, .3); background: rgba(46, 125, 79, .08); }
  .pill.bad { color: var(--bad); border-color: rgba(179, 38, 30, .3); background: rgba(179, 38, 30, .07); }
  .empty { padding: 36px; text-align: center; color: var(--mute); }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; color: var(--mute); }
  .note { color: var(--mute); font-size: 12.5px; margin-top: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="login" id="login">
  <form class="card" id="loginForm" novalidate>
    <div class="brand">WARE<b>XX</b> · Leads admin</div>
    <h1>Sign in</h1>
    <p>Leads and free-trial users from the website.</p>
    <label><span>Admin password</span><input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary" type="submit" style="width:100%">Sign in</button>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand">WARE<b>XX</b> · Leads admin</div>
    <button class="btn" id="signOut" type="button">Sign out</button>
  </header>

  <section class="stats" id="stats" aria-label="Totals"></section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-leads" aria-selected="true" data-view="leads">Leads</button>
    <button class="tab" role="tab" id="tab-trials" aria-selected="false" data-view="trials">Trial users</button>
  </div>

  <section class="card">
    <div class="tools">
      <input class="grow" type="search" id="q" placeholder="Search name, email, company or phone" aria-label="Search">
      <select id="filter" aria-label="Filter"></select>
      <button class="btn" id="exportBtn" type="button">Export CSV</button>
    </div>
    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <p class="empty" id="empty" hidden>Nothing here yet.</p>
    <div class="pager"><span id="count"></span>
      <span><button class="btn" id="prev" type="button">Previous</button> <button class="btn" id="next" type="button">Next</button></span></div>
  </section>
  <p class="note" id="dbnote"></p>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const KEY = 'wx_admin_token';
  let token = (() => { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } })();
  let view = 'leads', page = 0, total = 0, perPage = 50, timer = null;

  const FILTERS = {
    leads: [['', 'All forms'], ['demo', 'Free trial / demo'], ['contact', 'Contact'], ['plan', 'Plan enquiry'], ['brochure', 'Brochure'],
            ['sandbox', 'Live sandbox'], ['prebook', 'Pre-book'], ['partner', 'Launch partner']],
    trials: [['', 'All trials'], ['signed_up', 'Signed up'], ['not_signed_up', 'Not signed up yet'], ['email_failed', 'Email not sent']],
  };

  async function call(body) {
    const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, token }) });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (r.status === 401 && body.action !== 'login') { signOut(); throw new Error('Your session ended — please sign in again.'); }
    if (!r.ok) throw Object.assign(new Error(j.detail || 'error'), { status: r.status, detail: j.detail });
    if (j.demo) throw new Error('This browser is still running an old copy of the demo — reload the page.');
    return j;
  }

  const when = (iso) => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }); };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pill = (text, kind) => el('span', 'pill' + (kind ? ' ' + kind : ''), text);
  const cell = (...kids) => { const td = el('td'); kids.forEach((k) => td.append(typeof k === 'string' ? document.createTextNode(k) : k)); return td; };
  const two = (a, b) => { const d = el('div'); d.append(el('div', '', a || '—')); if (b) d.append(el('div', 'sub', b)); return d; };

  const COLS = {
    leads: ['Received', 'Form', 'Name / company', 'Contact', 'Interested in', 'Demo slot', 'Message', 'Email'],
    trials: ['Booked', 'Name / company', 'Email / phone', 'Trial window', 'Access email', 'Signed up', 'Last sign-in', 'Tour'],
  };
  const ROW = {
    leads: (r) => [cell(when(r.created_at)), cell(pill(r.type || '—')), cell(two(r.name, r.company)), cell(two(r.email, r.phone)),
      cell(r.interest || r.industry || '—'), cell(r.slot ? (r.slot === 'now' ? 'Start now' : when(r.slot)) : '—'),
      Object.assign(cell(r.message || ''), { className: 'msg' }),
      cell(r.email_sent == null ? '—' : r.email_sent ? pill('Sent', 'ok') : pill('Not sent', 'bad'))],
    trials: (r) => [cell(when(r.created_at)), cell(two(r.name, r.company)), cell(two(r.email, r.phone)), cell(r.window_text || '—'),
      cell(r.email_sent ? pill(r.emails_sent > 1 ? 'Sent ×' + r.emails_sent : 'Sent', 'ok') : pill('Not sent', 'bad')),
      cell(r.signed_up_at ? when(r.signed_up_at) : pill('Not yet')),
      cell(r.last_login_at ? two(when(r.last_login_at), r.logins + ' sign-in' + (r.logins == 1 ? '' : 's')) : '—'),
      cell(r.tour_state === 'completed' ? pill('Completed', 'ok') : r.tour_state === 'skipped' ? pill('Skipped') : '—')],
  };

  async function load() {
    $('thead').innerHTML = ''; const tr = el('tr'); COLS[view].forEach((c) => tr.append(el('th', '', c))); $('thead').append(tr);
    const body = { action: view, q: $('q').value.trim(), page };
    body[view === 'leads' ? 'type' : 'status'] = $('filter').value;
    try {
      const j = await call(body);
      if (!Array.isArray(j.rows)) throw new Error('Unexpected reply from the server — reload the page.');
      total = j.total; perPage = j.per_page || 50;
      const tb = $('tbody'); tb.innerHTML = '';
      j.rows.forEach((r) => { const row = el('tr'); ROW[view](r).forEach((td) => row.append(td)); tb.append(row); });
      $('empty').hidden = j.rows.length > 0;
      const from = total ? page * perPage + 1 : 0, to = Math.min(total, (page + 1) * perPage);
      $('count').textContent = total ? `${from}–${to} of ${total}` : '';
      $('prev').disabled = page === 0; $('next').disabled = to >= total;
    } catch (e) { $('tbody').innerHTML = ''; $('empty').hidden = false; $('empty').textContent = e.detail === 'database_unavailable' ? 'The database could not be reached.' : e.message; }
  }
  async function stats() {
    try {
      const s = await call({ action: 'summary' });
      const box = $('stats'); box.innerHTML = '';
      [['Leads', s.leads], ['Free trials', s.trials], ['Signed up', s.signed_up], ['Finished the tour', s.tour_completed], ['Email not sent', s.email_failed]]
        .forEach(([k, v]) => { const c = el('div', 'card stat'); c.append(el('small', '', k), el('b', '', String(v))); box.append(c); });
      $('dbnote').textContent = s.database === 'sqlite' ? 'Storage: a local SQLite file (no POSTGRES_URL set on this server).' : 'Storage: PostgreSQL.';
    } catch (e) { /* the table shows the problem */ }
  }
  function setView(v) {
    view = v; page = 0;
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.view === v)));
    $('filter').innerHTML = FILTERS[v].map(([val, label]) => `<option value="${val}">${label}</option>`).join('');
    $('q').value = ''; load();
  }
  function enter() { $('login').hidden = true; $('app').hidden = false; stats(); setView('leads'); }
  function signOut() { token = ''; try { sessionStorage.removeItem(KEY); } catch (e) {} $('app').hidden = true; $('login').hidden = false; $('pw').value = ''; }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const err = $('loginErr'); err.textContent = '';
    const btn = e.submitter || $('loginForm').querySelector('button'); btn.disabled = true;
    try {
      const j = await call({ action: 'login', password: $('pw').value });
      if (!j.token) throw new Error('no token');
      token = j.token; try { sessionStorage.setItem(KEY, token); } catch (ex) {}
      enter();
    } catch (ex) {
      err.textContent = { wrong_password: 'That password is not right.', too_many_attempts: 'Too many attempts — wait 15 minutes.',
        admin_not_configured: 'The admin is not switched on (ADMIN_PASSWORD is not set on the server).' }[ex.detail] || 'Could not sign in. Please try again.';
    }
    btn.disabled = false;
  });
  $('signOut').addEventListener('click', signOut);
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => setView(t.dataset.view)));
  $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { page = 0; load(); }, 300); });
  $('filter').addEventListener('change', () => { page = 0; load(); });
  $('prev').addEventListener('click', () => { if (page > 0) { page--; load(); } });
  $('next').addEventListener('click', () => { page++; load(); });
  $('exportBtn').addEventListener('click', async () => {
    const body = { action: 'export', what: view, q: $('q').value.trim() };
    body[view === 'leads' ? 'type' : 'status'] = $('filter').value;
    try {
      const j = await call(body);
      const url = URL.createObjectURL(new Blob(['﻿' + j.csv], { type: 'text/csv;charset=utf-8' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: j.filename });
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) { alert('The export could not be made: ' + (e.message || 'error')); }
  });

  if (token) enter();
})();
</script>
</body>
</html>
